<!-- head标签内引入Logto SDK -->
<script src="https://cdn.jsdelivr.net/npm/@logto/browser@2.20.0/dist/logto.browser.min.js"></script>

<script>
// ========== Logto配置，请修改为你自己部署的Logto域名、Web AppID ==========
const logtoConfig = {
  endpoint: "https://你的-logto域名",
  appId: "替换为你的web应用App ID",
};
const logtoClient = new LogtoBrowser.LogtoClient(logtoConfig);

const loginMask = document.getElementById('loginMask');
const mainApp = document.getElementById('mainApp');
const mainNav = document.getElementById('mainNav');
const btnGuest = document.getElementById('btnGuest');

// 游客模式标记常量
const GUEST_MARKER = "qizhi_guest";

/**
 * 检查登录状态
 */
async function checkAuthStatus() {
    // 判断是否游客模式
    const guestFlag = localStorage.getItem(GUEST_MARKER);
    if(guestFlag === "1"){
        loginMask.style.display="none";
        mainApp.classList.remove("app-hide");
        mainNav.classList.remove("app-hide");
        return;
    }

    const isAuth = await logtoClient.isAuthenticated();
    if(isAuth){
        // Logto已登录，获取用户信息
        const userInfo = await logtoClient.getUserInfo();
        console.log("登录用户手机号：", userInfo.primaryPhone);
        loginMask.style.display="none";
        mainApp.classList.remove("app-hide");
        mainNav.classList.remove("app-hide");
    }else{
        // 未登录，跳转Logto托管登录页面（只有登录，无注册入口）
        await logtoClient.signIn(window.location.origin + window.location.pathname);
    }
}

//页面加载，处理回调code
window.onload = async function(){
    const params = new URLSearchParams(window.location.search);
    if(params.has("code")){
        await logtoClient.handleSignInCallback();
        //清理url上的code参数
        window.history.replaceState({}, document.title, window.location.pathname);
    }
    await checkAuthStatus();
}

//游客模式按钮
btnGuest.onclick = function(){
    localStorage.setItem(GUEST_MARKER,"1");
    loginMask.style.display="none";
    mainApp.classList.remove("app-hide");
    mainNav.classList.remove("app-hide");
}

/**
 * 工具函数：业务层判断是否游客，在任务提交、福利兑换按钮调用
 * @returns {boolean} true=游客，需要弹窗拦截操作
 */
function isGuestUser(){
    return localStorage.getItem(GUEST_MARKER) === "1";
}

*/
</script>
